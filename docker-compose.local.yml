services:
  postgres:
    volumes:
      - postgres_data:/var/lib/postgresql/data
  garage:
    # Keep host bind mounts from docker-compose.yml (data/garage) so
    # scripts/backup_garage.sh / restore_garage.sh exercise the real path.
    ports:
      - "${GARAGE_S3_HOST_PORT:-3900}:3900"
  web:
    ports:
      - "${WEB_HOST_PORT:-8000}:8000"
    volumes:
      - static_data:/vol/static
      - media_data:/vol/media
      - logs_data:/vol/logs

volumes:
  postgres_data:
  static_data:
  media_data:
  logs_data:
