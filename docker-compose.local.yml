services:
  postgres:
    volumes:
      - postgres_data:/var/lib/postgresql/data
  minio:
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
  web:
    ports:
      - "8000:8000"
    volumes:
      - static_data:/vol/static
      - media_data:/vol/media
      - logs_data:/vol/logs

volumes:
  postgres_data:
  static_data:
  media_data:
  logs_data:
  minio_data:
