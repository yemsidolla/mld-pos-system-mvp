# Dev-auth-bypass overlay — LOCAL USE ONLY.
#
# Turns on the auth bypass AND binds the web port to loopback only, so the
# bypassed process is not reachable off this machine (the LAN/phone workflow in
# the README publishes on 0.0.0.0 — deliberately NOT used here).
#
#   docker compose -f docker-compose.yml -f docker-compose.local.yml \
#                  -f docker-compose.dev-bypass.yml up -d --build
#
# Never use this overlay against a production or SIT deployment. The startup
# guard would refuse to boot there anyway (public hosts in ALLOWED_HOSTS).
services:
  web:
    ports:
      # Loopback bind — overrides the 0.0.0.0 publish from the local overlay.
      - "127.0.0.1:${WEB_HOST_PORT:-8010}:8000"
    environment:
      DJANGO_DEBUG: "True"
      DEV_AUTH_BYPASS: "True"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,web,testserver"
      # The peer seen through docker-proxy is the bridge gateway, not loopback.
      # Trusting it is safe because the socket is bound to 127.0.0.1 above, so no
      # off-host client can connect in the first place.
      DEV_AUTH_BYPASS_TRUSTED_ADDRS: "127.0.0.1,::1,192.168.65.254,172.17.0.1"
