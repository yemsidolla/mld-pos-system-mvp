services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-melodu_pos}
      POSTGRES_USER: ${POSTGRES_USER:-melodu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-melodu_dev_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  garage:
    image: dxflrs/garage:v2.3.0
    command: ["/garage", "server"]
    environment:
      # Local default only — replace in .env for anything shared. Must be 64 hex chars.
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-}
    volumes:
      - ./docker/garage/garage.toml:/etc/garage.toml:ro
      - ./data/garage/meta:/var/lib/garage/meta
      - ./data/garage/data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: docker/django/Dockerfile
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-phase-0-dev-secret-key-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0,web}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      DJANGO_SESSION_COOKIE_SECURE: ${DJANGO_SESSION_COOKIE_SECURE:-False}
      DJANGO_CSRF_COOKIE_SECURE: ${DJANGO_CSRF_COOKIE_SECURE:-False}
      POSTGRES_DB: ${POSTGRES_DB:-melodu_pos}
      POSTGRES_USER: ${POSTGRES_USER:-melodu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-melodu_dev_password}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      TIME_ZONE: ${TIME_ZONE:-Asia/Phnom_Penh}
      DATA_ROOT: /vol
      DJANGO_STATIC_ROOT: /vol/static
      DJANGO_MEDIA_ROOT: /vol/media
      DJANGO_LOG_DIR: /vol/logs
      USE_S3_MEDIA: ${USE_S3_MEDIA:-False}
      S3_STORAGE_BUCKET_NAME: ${S3_STORAGE_BUCKET_NAME:-melodu-media}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-melodu_garage}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-melodu_garage_password}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://garage:3900}
      S3_CUSTOM_DOMAIN: ${S3_CUSTOM_DOMAIN:-}
      S3_REGION_NAME: ${S3_REGION_NAME:-us-east-1}
      S3_QUERYSTRING_AUTH: ${S3_QUERYSTRING_AUTH:-True}
      S3_QUERYSTRING_EXPIRE: ${S3_QUERYSTRING_EXPIRE:-3600}
    volumes:
      - ./data/static:/vol/static
      - ./data/media:/vol/media
      - ./data/logs:/vol/logs
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=5)\""]
      interval: 10s
      timeout: 5s
      retries: 5
