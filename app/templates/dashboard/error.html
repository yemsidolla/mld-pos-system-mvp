{% load i18n static %}
<!doctype html>
<html lang="{{ LANGUAGE_CODE|default:'en' }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ status_code }} {{ title }} | Melodu POS</title>
    <link rel="stylesheet" href="{% static 'core/css/dashboard.css' %}">
</head>
<body class="auth-page">
<div class="auth-backdrop" aria-hidden="true"></div>
<main class="auth-shell">
    <section class="auth-panel error-panel">
        <p class="terminal-line terminal-alert" aria-hidden="true">
            <span class="terminal-dot"></span>MELODU-POS // {% trans "ACCESS CONTROL" %}
        </p>

        <div class="auth-brand">
            <span class="brand-mark glow">M</span>
            <div>
                <p class="eyebrow">{% trans "Melodu POS" %}</p>
                <h1>{{ title }}</h1>
            </div>
        </div>

        <div class="error-readout" aria-hidden="true">
            <span class="error-code">{{ status_code }}</span>
            <span class="error-scan"></span>
        </div>

        <p class="error-message">{{ message }}</p>

        <div class="form-actions">
            <a class="btn btn-primary" href="{{ action_url }}">{{ action_label }}</a>
            {% if secondary_url %}
                <a class="btn btn-ghost" href="{{ secondary_url }}">{{ secondary_label }}</a>
            {% endif %}
        </div>

        <p class="auth-meta" aria-hidden="true">
            <span>EVENT&nbsp;LOGGED</span><span class="meta-sep">·</span>
            <span>AUDIT&nbsp;TRAIL&nbsp;ACTIVE</span>
        </p>
    </section>
</main>
</body>
</html>
