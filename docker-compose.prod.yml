services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  garage:
    image: dxflrs/garage:v2.3.0
    restart: unless-stopped
    command: ["/garage", "server"]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-}
    volumes:
      - ./docker/garage/garage.toml:/etc/garage.toml:ro
      - ./data/garage/meta:/var/lib/garage/meta
      - ./data/garage/data:/var/lib/garage/data
    ports:
      # S3 API only — host-bound to loopback for Nginx reverse proxy.
      # Admin (:3903) and RPC (:3901) stay on container loopback; use docker exec.
      - "127.0.0.1:${GARAGE_S3_HOST_PORT:-3900}:3900"
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: docker/django/Dockerfile
    restart: unless-stopped
    environment:
      APP_VERSION: ${APP_VERSION:-1.0.0-mvp}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS}
      DJANGO_SESSION_COOKIE_SECURE: ${DJANGO_SESSION_COOKIE_SECURE:-True}
      DJANGO_CSRF_COOKIE_SECURE: ${DJANGO_CSRF_COOKIE_SECURE:-True}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      TIME_ZONE: ${TIME_ZONE:-Asia/Phnom_Penh}
      DATA_ROOT: /vol
      DJANGO_STATIC_ROOT: /vol/static
      DJANGO_MEDIA_ROOT: /vol/media
      DJANGO_LOG_DIR: /vol/logs
      USE_S3_MEDIA: ${USE_S3_MEDIA:-True}
      S3_STORAGE_BUCKET_NAME: ${S3_STORAGE_BUCKET_NAME:-melodu-media}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://garage:3900}
      S3_CUSTOM_DOMAIN: ${S3_CUSTOM_DOMAIN:-}
      S3_REGION_NAME: ${S3_REGION_NAME:-us-east-1}
      S3_QUERYSTRING_AUTH: ${S3_QUERYSTRING_AUTH:-True}
      S3_QUERYSTRING_EXPIRE: ${S3_QUERYSTRING_EXPIRE:-3600}
    volumes:
      - ./data/static:/vol/static
      - ./data/media:/vol/media
      - ./data/logs:/vol/logs
    # Garage is intentionally NOT in depends_on: media storage must degrade
    # (missing images) without blocking the till. django-storages connects
    # lazily at request time; there is no startup ordering requirement.
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=5)\""]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-8001}:8000"
